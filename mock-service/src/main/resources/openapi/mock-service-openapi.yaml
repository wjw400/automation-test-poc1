openapi: 3.0.3
info:
  title: OrderFlow Secure Fulfillment API
  version: 2.0.0
  description: |
    Partner-facing order fulfillment API for the OrderFlow demonstration system.

    Every request payload is signed and encrypted as an ASCII-armored PGP message
    inside the JSON `payload` field. Successful responses use the same encrypted
    envelope. The `x-plaintext-request-schema` and `x-plaintext-response-schema`
    extensions describe the business JSON before encryption and after decryption.
servers:
  - url: http://localhost:8081
    description: Local OrderFlow service
tags:
  - name: Order Fulfillment
    description: Encrypted partner operations for the order fulfillment lifecycle
  - name: Fulfillment Console
    description: Plain JSON endpoints used by the OrderFlow demonstration UI
  - name: Request Activity
    description: Recorded web and secure API request activity
  - name: Partner Access
    description: Service public-key discovery and trusted partner profile management
paths:
  /secure/fulfillment/orders/create:
    post:
      tags:
        - Order Fulfillment
      summary: Create partner order
      description: Creates an order in `CREATED` status from a signed and encrypted business payload.
      operationId: createFulfillmentOrder
      parameters:
        - $ref: '#/components/parameters/ProfileParam'
      x-plaintext-request-schema:
        $ref: '#/components/schemas/CreateOrderPayload'
      x-plaintext-response-schema:
        $ref: '#/components/schemas/Order'
      requestBody:
        $ref: '#/components/requestBodies/EncryptedRequest'
      responses:
        '200':
          $ref: '#/components/responses/EncryptedSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /secure/fulfillment/orders/query:
    post:
      tags:
        - Order Fulfillment
      summary: Query partner order
      description: Returns the current order, lines, and shipment information.
      operationId: queryFulfillmentOrder
      parameters:
        - $ref: '#/components/parameters/ProfileParam'
      x-plaintext-request-schema:
        $ref: '#/components/schemas/OrderReferencePayload'
      x-plaintext-response-schema:
        $ref: '#/components/schemas/Order'
      requestBody:
        $ref: '#/components/requestBodies/EncryptedRequest'
      responses:
        '200':
          $ref: '#/components/responses/EncryptedSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /secure/fulfillment/orders/reserve:
    post:
      tags:
        - Order Fulfillment
      summary: Reserve order inventory
      description: Reserves product inventory and moves a `CREATED` order to `RESERVED`.
      operationId: reserveFulfillmentOrder
      parameters:
        - $ref: '#/components/parameters/ProfileParam'
      x-plaintext-request-schema:
        $ref: '#/components/schemas/OrderReferencePayload'
      x-plaintext-response-schema:
        $ref: '#/components/schemas/Order'
      requestBody:
        $ref: '#/components/requestBodies/EncryptedRequest'
      responses:
        '200':
          $ref: '#/components/responses/EncryptedSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /secure/fulfillment/orders/fulfill:
    post:
      tags:
        - Order Fulfillment
      summary: Dispatch order shipment
      description: Creates a shipment and moves a `RESERVED` order to `DISPATCHED`.
      operationId: fulfillFulfillmentOrder
      parameters:
        - $ref: '#/components/parameters/ProfileParam'
      x-plaintext-request-schema:
        $ref: '#/components/schemas/FulfillOrderPayload'
      x-plaintext-response-schema:
        $ref: '#/components/schemas/Order'
      requestBody:
        $ref: '#/components/requestBodies/EncryptedRequest'
      responses:
        '200':
          $ref: '#/components/responses/EncryptedSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /secure/fulfillment/orders/cancel:
    post:
      tags:
        - Order Fulfillment
      summary: Cancel partner order
      description: Cancels an order before dispatch and restores reserved inventory when necessary.
      operationId: cancelFulfillmentOrder
      parameters:
        - $ref: '#/components/parameters/ProfileParam'
      x-plaintext-request-schema:
        $ref: '#/components/schemas/OrderReferencePayload'
      x-plaintext-response-schema:
        $ref: '#/components/schemas/Order'
      requestBody:
        $ref: '#/components/requestBodies/EncryptedRequest'
      responses:
        '200':
          $ref: '#/components/responses/EncryptedSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /web-api/summary:
    get:
      tags: [Fulfillment Console]
      summary: Get fulfillment summary
      operationId: getFulfillmentSummary
      responses:
        '200':
          description: Current fulfillment totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FulfillmentSummary'
  /web-api/products:
    get:
      tags: [Fulfillment Console]
      summary: List products
      operationId: listProducts
      responses:
        '200':
          description: Available products.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
  /web-api/orders:
    get:
      tags: [Fulfillment Console]
      summary: List orders
      operationId: listWebOrders
      responses:
        '200':
          description: Orders ordered by creation time.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      tags: [Fulfillment Console]
      summary: Create order
      operationId: createWebOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderPayload'
      responses:
        '201':
          description: Order created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
  /web-api/orders/{orderId}:
    get:
      tags: [Fulfillment Console]
      summary: Get order
      operationId: getWebOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
  /web-api/orders/{orderId}/reserve:
    post:
      tags: [Fulfillment Console]
      summary: Reserve inventory for order
      operationId: reserveWebOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order reserved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
  /web-api/orders/{orderId}/fulfill:
    post:
      tags: [Fulfillment Console]
      summary: Dispatch order shipment
      operationId: fulfillWebOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                carrier:
                  type: string
                  example: Northstar Logistics
      responses:
        '200':
          description: Order dispatched with shipment details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
  /web-api/orders/{orderId}/cancel:
    post:
      tags: [Fulfillment Console]
      summary: Cancel order
      operationId: cancelWebOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
  /web-api/shipments:
    get:
      tags: [Fulfillment Console]
      summary: List shipments
      operationId: listShipments
      responses:
        '200':
          description: Shipments ordered by creation time.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Shipment'
  /web-api/activity:
    get:
      tags: [Request Activity]
      summary: List API activity
      operationId: listApiActivity
      responses:
        '200':
          description: Request activity summaries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiActivitySummary'
    delete:
      tags: [Request Activity]
      summary: Clear API activity
      operationId: clearApiActivity
      responses:
        '204':
          description: Activity cleared.
  /web-api/activity/{activityId}:
    get:
      tags: [Request Activity]
      summary: Get API activity detail
      operationId: getApiActivity
      parameters:
        - $ref: '#/components/parameters/ActivityId'
      responses:
        '200':
          description: Activity record including wire and decrypted payloads.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiActivityRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
  /web-api/admin/reset:
    post:
      tags: [Fulfillment Console]
      summary: Reset demonstration data
      operationId: resetDemoData
      responses:
        '200':
          description: Demo data restored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetResponse'
  /web-api/security/service-key:
    get:
      tags: [Partner Access]
      summary: Get service public key
      operationId: getServicePublicKey
      responses:
        '200':
          description: Service PGP public key and metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePublicKey'
  /web-api/security/service-key/download:
    get:
      tags: [Partner Access]
      summary: Download service public key
      operationId: downloadServicePublicKey
      responses:
        '200':
          description: ASCII-armored PGP public key.
          content:
            text/plain:
              schema:
                type: string
  /web-api/security/partners:
    get:
      tags: [Partner Access]
      summary: List partner profiles
      operationId: listPartnerProfiles
      responses:
        '200':
          description: Configured partner profiles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PartnerProfile'
    post:
      tags: [Partner Access]
      summary: Create partner profile
      operationId: createPartnerProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerProfileRequest'
      responses:
        '201':
          description: Partner profile created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
  /web-api/security/partners/{profileName}:
    put:
      tags: [Partner Access]
      summary: Replace partner profile
      operationId: replacePartnerProfile
      parameters:
        - $ref: '#/components/parameters/ProfileName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerProfileUpdateRequest'
      responses:
        '200':
          description: Partner profile replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      tags: [Partner Access]
      summary: Delete partner profile
      operationId: deletePartnerProfile
      parameters:
        - $ref: '#/components/parameters/ProfileName'
      responses:
        '204':
          description: Partner profile deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  parameters:
    ProfileParam:
      name: profile
      in: query
      required: false
      description: Trusted Partner Profile configured in OrderFlow Partner Access.
      schema:
        type: string
        default: secureEcho
        example: secureEcho
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        example: O3001
    ActivityId:
      name: activityId
      in: path
      required: true
      schema:
        type: string
        example: 4c66af65-836a-4fe6-95d3-f5c3d5cd0012
    ProfileName:
      name: profileName
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,80}$'
        example: secureEcho
  requestBodies:
    EncryptedRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EncryptedPayloadRequest'
  responses:
    EncryptedSuccess:
      description: Operation completed and the business result was encrypted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EncryptedPayloadResponse'
    BadRequest:
      description: Invalid envelope, PGP verification failure, or rejected business operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server-side failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    EncryptedPayloadRequest:
      type: object
      required:
        - payload
      properties:
        payload:
          type: string
          description: ASCII-armored PGP message containing the operation-specific JSON payload.
          example: |
            -----BEGIN PGP MESSAGE-----
            ...
            -----END PGP MESSAGE-----
      additionalProperties: false
    EncryptedPayloadResponse:
      type: object
      required:
        - code
        - message
        - traceId
        - profileUsed
        - operation
        - payload
      properties:
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          example: ok
        traceId:
          type: string
          example: T1001
        profileUsed:
          type: string
          example: secureEcho
        operation:
          type: string
          example: Create Order
        payload:
          type: string
          description: ASCII-armored PGP message containing the operation result.
          example: |
            -----BEGIN PGP MESSAGE-----
            ...
            -----END PGP MESSAGE-----
      additionalProperties: false
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: BAD_REQUEST
        message:
          type: string
          example: payload must contain an armored PGP string
      additionalProperties: false
    CreateOrderPayload:
      type: object
      required:
        - customerName
        - items
      properties:
        customerName:
          type: string
          example: Automation Partner
        customerReference:
          type: string
          example: AUTO-ORDER-1001
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateOrderLinePayload'
      additionalProperties: false
    CreateOrderLinePayload:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: string
          example: P100
        quantity:
          type: integer
          minimum: 1
          example: 2
      additionalProperties: false
    OrderReferencePayload:
      type: object
      required:
        - orderId
      properties:
        orderId:
          type: string
          example: O3001
      additionalProperties: false
    FulfillOrderPayload:
      allOf:
        - $ref: '#/components/schemas/OrderReferencePayload'
        - type: object
          properties:
            carrier:
              type: string
              example: Northstar Logistics
    Order:
      type: object
      required:
        - id
        - customerName
        - totalAmount
        - status
        - createdAt
        - updatedAt
        - items
      properties:
        id:
          type: string
          example: O3001
        customerName:
          type: string
          example: Northwind Design
        customerReference:
          type: string
          example: NW-2026-071
        totalAmount:
          type: number
          format: double
          example: 435.00
        status:
          $ref: '#/components/schemas/OrderStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        shipment:
          $ref: '#/components/schemas/Shipment'
    OrderLine:
      type: object
      required:
        - productId
        - productName
        - quantity
        - unitPrice
      properties:
        productId:
          type: string
          example: P100
        productName:
          type: string
          example: Wireless Mechanical Keyboard
        quantity:
          type: integer
          example: 2
        unitPrice:
          type: number
          format: double
          example: 129.00
    Shipment:
      type: object
      required:
        - id
        - orderId
        - trackingNumber
        - carrier
        - status
        - createdAt
      properties:
        id:
          type: string
          example: S5001
        orderId:
          type: string
          example: O3001
        trackingNumber:
          type: string
          example: OF-20260724-1001
        carrier:
          type: string
          example: Northstar Logistics
        status:
          type: string
          enum:
            - DISPATCHED
          example: DISPATCHED
        createdAt:
          type: string
          format: date-time
    OrderStatus:
      type: string
      enum:
        - CREATED
        - RESERVED
        - DISPATCHED
        - CANCELLED
      example: CREATED
    Product:
      type: object
      required:
        - id
        - sku
        - name
        - category
        - unitPrice
        - availableQuantity
        - status
        - imageKey
      properties:
        id:
          type: string
          example: P100
        sku:
          type: string
          example: WH-KEY-84
        name:
          type: string
          example: Wireless Mechanical Keyboard
        category:
          type: string
          example: Workspace
        unitPrice:
          type: number
          format: double
          example: 129.00
        availableQuantity:
          type: integer
          example: 38
        status:
          type: string
          enum: [ACTIVE]
        imageKey:
          type: string
          example: keyboard
    FulfillmentSummary:
      type: object
      required: [products, orders, shipments, pendingOrders]
      properties:
        products:
          type: integer
        orders:
          type: integer
        shipments:
          type: integer
        pendingOrders:
          type: integer
    ResetResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          example: RESET
        message:
          type: string
          example: Demo data restored
    PartnerProfileRequest:
      type: object
      required: [profileName, displayName, publicKey]
      properties:
        profileName:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,80}$'
          example: secureEcho
        displayName:
          type: string
          example: Secure Echo Partner
        publicKey:
          type: string
          description: ASCII-armored PGP public key with an encryption-capable key.
    PartnerProfileUpdateRequest:
      type: object
      required: [displayName, publicKey]
      properties:
        displayName:
          type: string
          example: Secure Echo Partner
        publicKey:
          type: string
          description: ASCII-armored PGP public key with an encryption-capable key.
    PartnerProfile:
      type: object
      required: [profileName, displayName, keyId, fingerprint, algorithm, updatedAt, defaultProfile]
      properties:
        profileName:
          type: string
        displayName:
          type: string
        keyId:
          type: string
        fingerprint:
          type: string
        algorithm:
          type: string
        userId:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
        defaultProfile:
          type: boolean
    ServicePublicKey:
      type: object
      required: [keyId, fingerprint, algorithm, createdAt, publicKey]
      properties:
        keyId:
          type: string
        fingerprint:
          type: string
        algorithm:
          type: string
        userId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        publicKey:
          type: string
          description: ASCII-armored PGP public key.
    ApiActivitySummary:
      type: object
      required: [id, startedAt, channel, operation, method, path, outcome, statusCode, durationMs]
      properties:
        id:
          type: string
        startedAt:
          type: string
          format: date-time
        channel:
          type: string
          enum: [WEB, SECURE_API]
        operation:
          type: string
        method:
          type: string
        path:
          type: string
        profile:
          type: string
          nullable: true
        outcome:
          type: string
        statusCode:
          type: integer
        durationMs:
          type: integer
          format: int64
        errorMessage:
          type: string
          nullable: true
    ApiActivityRecord:
      allOf:
        - $ref: '#/components/schemas/ApiActivitySummary'
        - type: object
          properties:
            wireRequest: {}
            decryptedRequest: {}
            businessResult: {}
            wireResponse: {}
            errorMessage:
              type: string
              nullable: true
