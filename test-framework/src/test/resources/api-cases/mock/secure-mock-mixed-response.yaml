dslVersion: v1
name: Secure mock service mixed response
description: Validate plaintext response fields and a decrypted PGP response payload.
tags:
  - mock-service
  - mixed-response
runtime:
  profile: secureEcho
variables:
  baseUrl: http://localhost:8081
profiles:
  secureEcho:
    senderPublicKey: classpath:keys/server-public.asc
    senderPrivateKey: classpath:keys/client-private.asc
    senderPrivateKeyPassphrase: demo-client-passphrase
    recipientPublicKey: classpath:keys/server-public.asc
    recipientPrivateKey: classpath:keys/client-private.asc
    recipientPrivateKeyPassphrase: demo-client-passphrase
steps:
  - name: Validate local secure mock response
    type: http
    operation:
      operationId: submitSecureJsonField
      method: POST
      path: /secure/json-field
    runtime: {}
    request:
      query:
        field: bizData
      headers:
        Content-Type: application/json
      body:
        customerId: C1
        amount: 88
    actions:
      beforeSend:
        - type: crypto.pgp.signAndEncrypt
          name: Protect business payload
          input:
            source: request.body
            format: json
          output:
            target: artifacts.encryptedPayload
            format: text
        - type: body.buildJson
          name: Build encrypted request envelope
          template:
            bizData: ${artifacts.encryptedPayload}
          output:
            target: request.body
      afterReceive:
        - type: crypto.pgp.decryptAndVerify
          name: Read secure response payload
          input:
            source: response.body
            path: $.payload
          output:
            target: decrypted.securePayload
            format: json
    response:
      status: 200
      assertions:
        - source: response.body
          path: $.code
          operator: equals
          expected: SUCCESS
        - source: response.body
          path: $.fieldUsed
          operator: equals
          expected: bizData
        - source: decrypted.securePayload
          path: $.result
          operator: equals
          expected: ACCEPTED
        - source: decrypted.securePayload
          path: $.customerId
          operator: equals
          expected: C1
      extract: {}
