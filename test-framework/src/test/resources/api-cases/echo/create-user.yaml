name: Create user through echo API
description: Minimal structured API case executed from a single Cucumber step.
tags:
  - poc
  - ai-ready

variables:
  baseUrl: https://postman-echo.com
  userName: Alice
  email: poc_${random.uuid}@example.com

profiles:
  default:
    senderPrivateKey: classpath:keys/client-private.asc
    recipientPublicKey: classpath:keys/server-public.asc

request:
  method: POST
  baseUrl: ${baseUrl}
  path: /post
  headers:
    Content-Type: application/json
  body:
    name: ${userName}
    email: ${email}

expect:
  status: 200
  jsonPath:
    $.json.name: ${userName}
    $.json.email: ${email}
    $.url: https://postman-echo.com/post

extract:
  echoedName: $.json.name
