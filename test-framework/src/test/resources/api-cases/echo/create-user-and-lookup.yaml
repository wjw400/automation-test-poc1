dslVersion: v1
name: Create user and lookup by extracted value
description: Multi-step API case that shares extracted context between API calls.
tags:
  - poc
  - multi-step
runtime: {}
variables:
  baseUrl: https://postman-echo.com
  userName: Alice
  email: poc_${random.uuid}@example.com
steps:
  - name: Create user through echo API
    type: http
    operation:
      operationId: echoCreateUser
      method: POST
      path: /post
    runtime: {}
    request:
      query: {}
      headers:
        Content-Type: application/json
      body:
        name: ${userName}
        email: ${email}
    actions:
      beforeSend: []
      afterReceive: []
    response:
      status: 200
      assertions:
        - source: response.body
          path: $.json.name
          operator: equals
          expected: ${userName}
        - source: response.body
          path: $.json.email
          operator: equals
          expected: ${email}
      extract:
        createdEmail:
          source: response.body
          path: $.json.email
  - name: Lookup user by extracted email
    type: http
    operation:
      operationId: echoLookupUser
      method: GET
      path: /get
    runtime: {}
    request:
      query:
        email: ${createdEmail}
      headers: {}
    actions:
      beforeSend: []
      afterReceive: []
    response:
      status: 200
      assertions:
        - source: response.body
          path: $.args.email
          operator: equals
          expected: ${createdEmail}
      extract: {}
