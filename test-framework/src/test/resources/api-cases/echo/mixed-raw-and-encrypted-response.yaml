name: Validate raw and decrypted response fields together
description: Demonstrates mixed plaintext and encrypted response validation with fake decrypt.
tags:
  - poc
  - mixed-response

variables:
  baseUrl: https://postman-echo.com

profiles:
  secureEcho:
    senderPublicKey: classpath:keys/server-public.asc
    recipientPrivateKey: classpath:keys/client-private.asc
    recipientPrivateKeyPassphrase: ${env.CLIENT_KEY_PASSPHRASE}

steps:
  - name: Validate plaintext and decrypted payload
    profile: secureEcho
    request:
      method: POST
      baseUrl: ${baseUrl}
      path: /post
      headers:
        Content-Type: application/json
      body:
        code: SUCCESS
        message: ok
        payload: 'ENCRYPTED({"orderId":"O123","amount":100,"status":"CREATED"})'
    expect:
      status: 200
      decrypt:
        - name: securePayload
          input:
            mode: jsonField
            path: $.json.payload
          algorithm: fake
          plaintextFormat: json
      validations:
        - source: raw
          path: $.json.code
          operator: equals
          expected: SUCCESS
        - source: raw
          path: $.json.message
          operator: equals
          expected: ok
        - source: decrypted.securePayload
          path: $.orderId
          operator: equals
          expected: O123
        - source: decrypted.securePayload
          path: $.amount
          operator: equals
          expected: 100
    extract:
      orderId:
        source: decrypted.securePayload
        path: $.orderId
      responseCode:
        source: raw
        path: $.json.code
