spring:
  application:
    name: platform-api
  datasource:
    url: jdbc:postgresql://localhost:5432/automation_test_poc
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8090

agent:
  default-runtime: ${AGENT_DEFAULT_RUNTIME:FAKE}
  max-turns: ${AGENT_MAX_TURNS:20}
  max-tool-calls: ${AGENT_MAX_TOOL_CALLS:20}
  max-repeated-tool-calls: ${AGENT_MAX_REPEATED_TOOL_CALLS:3}
  max-no-progress-tool-calls: ${AGENT_MAX_NO_PROGRESS_TOOL_CALLS:3}
  turn-timeout: ${AGENT_TURN_TIMEOUT:60s}
  fake:
    chunk-delay: ${AGENT_FAKE_CHUNK_DELAY:10ms}
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
    temperature: ${DEEPSEEK_TEMPERATURE:0.2}
